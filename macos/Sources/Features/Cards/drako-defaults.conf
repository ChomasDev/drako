# Drako default configuration.
#
# Loaded BEFORE the user's Ghostty config files, so anything set in
# ~/.config/ghostty/config overrides these values (see drako-overrides.conf
# for the one exception, `theme`).

# Neutral charcoal with small pastel accents.
background = #171719
foreground = #dedee3
cursor-color = #c4b5fd
cursor-text = #171719
# Muted lavender selection (selection colors cannot carry alpha).
selection-background = #373440
selection-foreground = #dedee3

# Pastel ANSI palette, readable on near-black.
palette = 0=#2b2b30
palette = 1=#f4a5ae
palette = 2=#a7f3d0
palette = 3=#f9e2a6
palette = 4=#a5c8f4
palette = 5=#d7b8f3
palette = 6=#a5e9e6
palette = 7=#dddde2
palette = 8=#666670
palette = 9=#f7bcc3
palette = 10=#c2f7df
palette = 11=#fbebc0
palette = 12=#bfd8f7
palette = 13=#e4cdf7
palette = 14=#c0f1ef
palette = 15=#f4f4f6

# Translucent, blurred window. The card chrome draws its own tint on top.
background-opacity = 0.97
background-blur = 24

# Calm: unfocused panes are dimmed only a little.
unfocused-split-opacity = 0.96
unfocused-split-fill = #171719
window-padding-x = 8
window-padding-y = 6
window-padding-balance = true
# The padding takes the color of the nearest cells, so a program's own
# background (nvim) fills the whole card.
window-padding-color = extend

# Panes run `drako attach`: closing one is deliberate (it kills the session)
# and quitting only detaches, so there is nothing to confirm.
confirm-close-surface = false
