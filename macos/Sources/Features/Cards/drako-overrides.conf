# Drako overrides.
#
# Loaded AFTER the user's Ghostty config files. Drako shares those files with
# Ghostty (keybindings, fonts, ...), but not the Ghostty theme: an empty value
# resets it, so the Drako colors below show by default. Explicit color keys in
# the user's config (background = ..., palette = ...) still win.
