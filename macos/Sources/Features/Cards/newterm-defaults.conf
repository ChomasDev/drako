# newterm default configuration.
#
# Loaded BEFORE the user's Ghostty config files, so anything set in
# ~/.config/ghostty/config overrides these values.

# Warm dark charcoal / brown theme
background = #1c1815
foreground = #ebe3d8
cursor-color = #f2b48a
selection-background = #4a3d33
selection-foreground = #f4ece2
palette = 0=#2a2420
palette = 8=#6b5f55

# Translucent, blurred window. The card chrome draws its own tint on top.
background-opacity = 0.9
background-blur = 24

# Panes are rendered as cards, so dim unfocused ones only slightly.
unfocused-split-opacity = 0.88
window-padding-x = 6
window-padding-y = 4
window-padding-balance = true
